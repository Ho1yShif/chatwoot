projects:
  - name: chatwoot
    environments:
      - name: production
        services:
          - type: web
            name: chatwoot-web
            runtime: docker
            plan: standard
            region: oregon
            branch: render-deploy
            dockerfilePath: ./docker/Dockerfile
            dockerContext: .
            dockerCommand: sh -c "bundle exec rails ip_lookup:setup && bundle exec rails server -b 0.0.0.0 -p $PORT"
            preDeployCommand: POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare
            healthCheckPath: /health
            envVars:
              - fromGroup: chatwoot-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: chatwoot-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: chatwoot-redis
                  property: connectionString
              - key: WEB_CONCURRENCY
                value: "2"
              - key: RAILS_MAX_THREADS
                value: "5"

          - type: worker
            name: chatwoot-worker
            runtime: docker
            plan: standard
            region: oregon
            branch: render-deploy
            dockerfilePath: ./docker/Dockerfile
            dockerContext: .
            dockerCommand: sh -c "bundle exec rails ip_lookup:setup && bundle exec sidekiq -C config/sidekiq.yml"
            envVars:
              - fromGroup: chatwoot-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: chatwoot-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: chatwoot-redis
                  property: connectionString
              - key: SIDEKIQ_CONCURRENCY
                value: "10"

          - type: keyvalue
            name: chatwoot-redis
            plan: starter
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: []

        databases:
          - name: chatwoot-db
            databaseName: chatwoot_production
            user: chatwoot
            plan: basic-1gb
            region: oregon
            postgresMajorVersion: "16"
            ipAllowList: []

        envVarGroups:
          - name: chatwoot-shared
            envVars:
              - key: RAILS_ENV
                value: production
              - key: NODE_ENV
                value: production
              - key: INSTALLATION_ENV
                value: docker
              - key: SECRET_KEY_BASE
                generateValue: true
              - key: FRONTEND_URL
                sync: false
              - key: FORCE_SSL
                value: "true"
              - key: RAILS_LOG_TO_STDOUT
                value: "true"
              - key: ENABLE_ACCOUNT_SIGNUP
                value: "false"
              - key: ACTIVE_STORAGE_SERVICE
                value: s3_compatible
              - key: STORAGE_BUCKET_NAME
                sync: false
              - key: STORAGE_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_REGION
                value: auto
              - key: STORAGE_ENDPOINT
                sync: false
              - key: MAILER_SENDER_EMAIL
                sync: false
              - key: SMTP_ADDRESS
                sync: false
              - key: SMTP_PORT
                value: "587"
              - key: SMTP_USERNAME
                sync: false
              - key: SMTP_PASSWORD
                sync: false
              - key: SMTP_DOMAIN
                sync: false
